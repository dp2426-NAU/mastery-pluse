name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      # better-sqlite3's prebuilt binary occasionally mismatches the exact
      # Node ABI a runner image ships, which segfaults the whole process
      # before a single test can run. Building from source on the runner
      # itself removes that class of failure entirely.
      - run: npm rebuild better-sqlite3 --build-from-source
      - run: npm test
