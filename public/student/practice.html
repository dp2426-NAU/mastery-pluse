<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastery Pulse — Exams</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  .wrap{ max-width:760px; margin:0 auto; padding:28px 20px 90px; }
  .banner{
    background:rgba(240,180,41,.12); border:1px solid var(--warn); border-radius:10px;
    padding:12px 16px; margin-bottom:20px; font-size:.88rem; display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .banner button{ width:auto; margin:0; padding:7px 14px; font-size:.82rem; }
  .topic-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; margin-bottom:28px; }
  .topic-card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px;
    cursor:pointer; text-align:left; color:var(--text);
  }
  .topic-card:hover{ border-color:var(--accent); }
  .topic-card .name{ font-family:var(--serif); font-size:1rem; margin:0 0 8px; color:var(--text); }
  .topic-card .score{ font-family:var(--mono); font-size:.8rem; color:var(--text-muted); }
  .topic-card .score.good{ color:var(--good); }
  .topic-card .score.bad{ color:var(--bad); }

  .item-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:16px; }
  .item-kind{ font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); margin:0 0 10px; }
  .item-prompt{ font-family:var(--serif); font-size:1.1rem; margin:0 0 16px; text-wrap:balance; }
  .opt{
    display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:11px 14px; margin-bottom:8px; cursor:pointer; font-size:.92rem; font-family:var(--sans);
  }
  .opt.selected{ border-color:var(--accent); background:rgba(91,140,255,.12); }
  textarea{
    width:100%; min-height:90px; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:12px; font-family:var(--sans); font-size:.9rem; resize:vertical;
  }
  .submit-row{ text-align:center; margin-top:8px; }
  .submit-row button{ width:auto; padding:12px 32px; }
  .results{ text-align:center; }
  .score-big{ font-family:var(--serif); font-size:2.4rem; margin:6px 0; }
  .score-big.good{ color:var(--good); } .score-big.bad{ color:var(--bad); } .score-big.mid{ color:var(--warn); }
  .compare{ font-family:var(--mono); font-size:.85rem; color:var(--text-muted); margin-bottom:24px; }
  .result-item{ text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; font-size:.88rem; }
  .result-item.wrong{ border-left:3px solid var(--bad); }
  .result-item.right{ border-left:3px solid var(--good); }
  .result-item.pending{ border-left:3px solid var(--warn); }
  .back-link{ display:inline-block; margin-top:18px; cursor:pointer; color:var(--accent); font-size:.88rem; }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">Mastery Pulse · Student</span>
    <span><span class="who" id="whoami"></span><button class="logout" id="logoutBtn">Sign out</button></span>
  </div>
  <div class="wrap">
    <div id="bannerArea"></div>
    <div id="view"></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/live.js"></script>
  <script src="/student/app.js"></script>
</body>
</html>
