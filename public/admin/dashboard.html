<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mastery Pulse — Administrator Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/shared/styles.css">
<style>
  .layout{ display:grid; grid-template-columns:210px minmax(0,1fr); gap:28px; max-width:1240px; margin:0 auto; padding:28px 24px 80px; }
  .side{ display:flex; flex-direction:column; gap:4px; position:sticky; top:24px; align-self:start; }
  .side button{ margin:0; text-align:left; background:transparent; color:var(--text-muted); font-weight:500; font-size:.9rem; padding:10px 14px; white-space:nowrap; }
  .side button:hover{ background:var(--surface); color:var(--text); }
  .side button[aria-current="page"]{ background:var(--surface-2); color:var(--text); box-shadow:inset 3px 0 0 var(--good); }
  h1{ font-family:var(--serif); font-size:1.5rem; margin:0 0 4px; }
  h2{ font-family:var(--serif); font-size:1.1rem; margin:0 0 12px; }
  .sub{ color:var(--text-muted); font-size:.86rem; margin:0 0 20px; max-width:65ch; }
  .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .head .sub{ margin-bottom:0; }
  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; }
  .stat-strip{ margin-bottom:24px; }

  .btn{ width:auto; margin:0; padding:9px 16px; font-size:.86rem; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--text); font-weight:500; }
  .btn.small{ padding:5px 10px; font-size:.78rem; }
  .btn.danger{ background:transparent; border:1px solid rgba(226,88,63,.5); color:#F08A76; font-weight:500; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  button:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  select, textarea{ background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px 12px; font:inherit; font-size:.92rem; width:100%; }
  textarea{ resize:vertical; min-height:76px; }
  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .filters input{ flex:1 1 220px; width:auto; }
  .filters select{ width:auto; }

  .table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); }
  table{ width:100%; border-collapse:collapse; font-size:.87rem; }
  th, td{ padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  th{ font-weight:500; font-size:.78rem; color:var(--text-muted); white-space:nowrap; }
  td .uname{ font-family:var(--mono); font-size:.76rem; color:var(--text-muted); }
  td.actions{ white-space:nowrap; text-align:right; }
  td.actions .btn + .btn{ margin-left:6px; }
  td.when{ font-family:var(--mono); font-size:.76rem; color:var(--text-muted); white-space:nowrap; }
  tr.off td:not(.actions){ opacity:.6; }
  .status{ display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .status::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--good); }
  .status.off::before{ background:var(--bad); }
  .empty{ padding:24px; color:var(--text-muted); text-align:center; }

  .row{ display:flex; justify-content:space-between; align-items:center; gap:20px; padding:14px 0; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; padding-bottom:0; }
  .row:first-of-type{ padding-top:0; }
  .row .t{ font-size:.92rem; }
  .row .d{ font-size:.8rem; color:var(--text-muted); margin-top:2px; }
  .row input[type=number]{ width:100px; flex-shrink:0; }
  .row.stack{ flex-direction:column; align-items:stretch; gap:10px; }
  .row label{ margin:0; color:var(--text); }
  .switch{ appearance:none; width:42px; height:24px; border-radius:999px; padding:0; background:var(--line); border:none; position:relative; cursor:pointer; flex-shrink:0; transition:background .15s; }
  .switch::after{ content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s; }
  .switch:checked{ background:var(--good); }
  .switch:checked::after{ transform:translateX(18px); }
  .switch:disabled{ opacity:.5; cursor:not-allowed; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }

  dialog{ background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:var(--radius); padding:26px 28px; width:min(440px, calc(100vw - 32px)); box-shadow:var(--shadow-lg); }
  dialog::backdrop{ background:rgba(4,8,18,.65); }
  dialog p{ color:var(--text-muted); font-size:.88rem; line-height:1.55; margin:0 0 8px; }
  .dlg-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
  .secret{ font-family:var(--mono); font-size:1.05rem; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; user-select:all; margin-top:12px; }

  @media (max-width:820px){
    .layout{ grid-template-columns:minmax(0,1fr); gap:18px; padding:18px 16px 60px; }
    .side{ position:static; flex-direction:row; overflow-x:auto; }
    .side button{ width:auto; }
    .side button[aria-current="page"]{ box-shadow:inset 0 -3px 0 var(--good); }
    .two{ grid-template-columns:1fr; }
    .topbar{ padding:12px 16px; }
    .topbar .brand-kicker, .topbar .who{ display:none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand-cluster">
      <span class="brand-mark">MP</span>
      <span class="brand-text">
        <span class="brand">Mastery Pulse</span>
        <span class="brand-kicker">Administrator Console</span>
      </span>
    </span>
    <span class="topbar-right"><span class="who" id="whoami"></span><button class="logout" id="logoutBtn">Sign out</button></span>
  </div>
  <div class="layout">
    <nav class="side" id="nav" aria-label="Administration">
      <button data-tab="overview">Overview</button>
      <button data-tab="users">User accounts</button>
      <button data-tab="permissions">Roles &amp; permissions</button>
      <button data-tab="settings">System settings</button>
      <button data-tab="audit">Audit log</button>
    </nav>
    <main id="view"></main>
  </div>
  <dialog id="dlg"></dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/system-banner.js"></script>
  <script src="/shared/live.js"></script>
  <script src="/admin/dashboard.js"></script>
</body>
</html>
